<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICH | Celebration Display</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Montserrat:wght@400;700;900&display=swap"
        rel="stylesheet">

    <script src="js/theme-manager.js"></script>
    <script>ThemeManager.init('tv_display');</script>
    <link rel="stylesheet" href="css/themes/classic/tv_display.css?v=20261025-2">
</head>

<body onload="initTV()">
    <div class="bg-animate"></div>
    <div class="tv-shell">
        <header id="main-header">
            <div class="brand-block">
                <h1>INDIAN COFFEE HOUSE</h1>
                <p class="brand-tagline theme-text">Authentic Kerala <span>•</span> Athlone</p>
            </div>
            <div class="clock-panel">
                <span class="open-label"><i class="fa-solid fa-circle"></i> Open today</span>
                <div id="clock">00:00</div>
                <div id="current-date">Loading date</div>
            </div>
        </header>

        <main id="view-port">
            <div class="menu-heading">
                <span class="menu-kicker">Freshly prepared</span>
                <h2>Today's Menu</h2>
                <div class="heading-rule"></div>
            </div>
            <div id="menu-wall"></div>
        </main>
    </div>
    <div class="ticker-wrap">
        <div id="ticker-msg" class="ticker">Welcome!</div>
    </div>

    <div id="fs-hint"
        class="fixed top-2 right-2 text-white/20 text-[10px] font-bold uppercase pointer-events-none z-50 animate-pulse">
        Click for Fullscreen</div>

    <script src="js/tv_display.js?v=20261025-1"></script>
</body>

</html>
