<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Analytics | ICH POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
    <script src="config.js"></script>

    <script src="js/theme-manager.js"></script>
    <script>ThemeManager.init('reports');</script>
    <!-- Restored Logic Script -->
    <script src="js/reports.js"></script>
</head>

<body class="bg-gray-100 min-h-screen text-gray-800" onload="initReports()">

    <!-- Header -->
    <header class="bg-gray-900 text-white px-6 py-4 shadow-md flex justify-between items-center text-sm md:text-base">
        <div class="flex items-center gap-4">
            <button onclick="window.close()"
                class="w-10 h-10 rounded-full bg-gray-800 hover:bg-gray-700 flex items-center justify-center text-gray-400 transition">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h1 class="text-xl font-bold text-purple-400">Advanced Sales Reports</h1>
        </div>
        <div id="sync-status" class="text-xs text-gray-400 font-mono">Loading...</div>
    </header>

    <!-- Controls -->
    <div class="p-6 pb-2">
        <div class="bg-white rounded-xl shadow p-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <!-- Period Selector -->
            <div class="flex bg-gray-100 p-1 rounded-lg">
                <button onclick="setPeriod('week')" id="btn-week"
                    class="px-4 py-2 rounded-md text-sm font-bold transition hover:bg-white hover:shadow-sm">This
                    Week</button>
                <button onclick="setPeriod('month')" id="btn-month"
                    class="px-4 py-2 rounded-md text-sm font-bold bg-white shadow-sm text-purple-700">This
                    Month</button>
                <button onclick="setPeriod('year')" id="btn-year"
                    class="px-4 py-2 rounded-md text-sm font-bold transition hover:bg-white hover:shadow-sm">This
                    Year</button>
                <button onclick="setPeriod('5year')" id="btn-5year"
                    class="px-4 py-2 rounded-md text-sm font-bold transition hover:bg-white hover:shadow-sm">Last 5
                    Years</button>
            </div>

            <!-- Actions -->
            <div class="flex gap-2">
                <button onclick="downloadReport('pdf')"
                    class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded font-bold shadow transition text-sm flex items-center gap-2">
                    <i class="fas fa-file-pdf"></i> Download PDF
                </button>
                <button onclick="downloadReport('excel')"
                    class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded font-bold shadow transition text-sm flex items-center gap-2">
                    <i class="fas fa-file-excel"></i> Export Data
                </button>
            </div>
        </div>
    </div>

    <!-- KPIs -->
    <div class="px-6 py-2 grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="bg-white p-4 rounded-xl shadow border border-gray-100">
            <p class="text-xs font-bold text-gray-400 uppercase">Total Revenue</p>
            <h2 class="text-2xl font-bold text-gray-800 mt-1" id="kpi-revenue">€0.00</h2>
        </div>
        <div class="bg-white p-4 rounded-xl shadow border border-gray-100">
            <p class="text-xs font-bold text-gray-400 uppercase">Total Orders</p>
            <h2 class="text-2xl font-bold text-blue-600 mt-1" id="kpi-orders">0</h2>
        </div>
        <div class="bg-white p-4 rounded-xl shadow border border-gray-100">
            <p class="text-xs font-bold text-gray-400 uppercase">Avg. Order Value</p>
            <h2 class="text-2xl font-bold text-purple-600 mt-1" id="kpi-avg">€0.00</h2>
        </div>
        <div class="bg-white p-4 rounded-xl shadow border border-gray-100">
            <p class="text-xs font-bold text-gray-400 uppercase">Top Category</p>
            <h2 class="text-lg font-bold text-orange-500 mt-1 truncate" id="kpi-top-cat">-</h2>
        </div>
    </div>

    <!-- Visualizations Grid -->
    <div class="p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

        <!-- 1. Revenue History (Bar/Line) -->
        <div class="bg-white p-4 rounded-xl shadow border border-gray-100 lg:col-span-2">
            <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2"><i
                    class="fas fa-chart-line text-blue-500"></i> Revenue Trend</h3>
            <div class="h-64"><canvas id="chart-trend"></canvas></div>
        </div>

        <!-- 2. Items Share (Donut) -->
        <div class="bg-white p-4 rounded-xl shadow border border-gray-100">
            <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2"><i
                    class="fas fa-chart-pie text-orange-500"></i> Sales by Items</h3>
            <div class="h-64"><canvas id="chart-category"></canvas></div>
        </div>

        <!-- 3. Peak Hours (Histogram) -->
        <div class="bg-white p-4 rounded-xl shadow border border-gray-100">
            <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2"><i
                    class="fas fa-clock text-purple-500"></i> Peak Hours (Heatmap)</h3>
            <div class="h-64"><canvas id="chart-hours"></canvas></div>
        </div>

        <!-- 4. Dining vs Takeaway (Pie) -->
        <div class="bg-white p-4 rounded-xl shadow border border-gray-100">
            <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2"><i
                    class="fas fa-utensils text-green-500"></i> Order Type</h3>
            <div class="h-64 flex justify-center"><canvas id="chart-type"></canvas></div>
        </div>

        <!-- 5. Payment Methods (Bar) -->
        <div class="bg-white p-4 rounded-xl shadow border border-gray-100">
            <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2"><i
                    class="fas fa-credit-card text-gray-500"></i> Payment Methods</h3>
            <div class="h-64"><canvas id="chart-payment"></canvas></div>
        </div>
    </div>

    <!-- Summary Table -->
    <div class="px-6 pb-6">
        <div class="bg-white rounded-xl shadow border border-gray-200 overflow-hidden">
            <div class="p-4 border-b border-gray-100 font-bold text-gray-700">Detailed Breakdown</div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-center">
                    <thead class="bg-gray-50 text-gray-500 uppercase text-xs font-bold">
                        <tr>
                            <th class="px-4 py-3 text-left">Period / Date</th>
                            <th class="px-4 py-3">Orders</th>
                            <th class="px-4 py-3">Revenue</th>
                            <th class="px-4 py-3">Dining</th>
                            <th class="px-4 py-3">Takeaway</th>
                        </tr>
                    </thead>
                    <tbody id="summary-body" class="divide-y divide-gray-100">
                        <!-- JS Populated -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/reports.js"></script>
</body>

</html>
